# ============================================================
#  PRISM — Docker Compose
#  Services: backend (Flask + PyTorch), minio (S3)
# ============================================================

services:
  # --------------------------------------------------------
  #  MinIO — S3-compatible object storage
  # --------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: prism-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------
  #  MinIO Init — create bucket & seed existing api_data
  # --------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: prism-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./api_data:/seed_data:ro
      - ./docker/minio/init.sh:/init.sh:ro
      - backend_api_data:/backend_data
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-prism-data}

  # --------------------------------------------------------
  #  Backend — Flask API + PyTorch
  # --------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: prism-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      PORT: 5000
      DATA_DIR: api_data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost,https://prism-data-ingestion-v1.web.app,https://prism-data-ingestion-v1.firebaseapp.com}
      AUTH0_ENABLED: ${AUTH0_ENABLED:-false}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      MAX_CSV_RECORDS: ${MAX_CSV_RECORDS:-1000}
      # MinIO config
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-prism-data}
      MINIO_SECURE: "false"
    volumes:
      # Models and datasets are baked into the image.
      # Uncomment for hot-reload during development:
      # - ./models:/app/models:ro
      # - ./datasets:/app/datasets:ro
      - backend_api_data:/app/api_data
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
  backend_api_data:
    driver: local